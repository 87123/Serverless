<!DOCTYPE html>
<html>
<head>
  <title>Stock Price Prediction</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      padding-top: 100px;
      background-color: #f4f4f4;
    }
    input {
      padding: 10px;
      font-size: 16px;
      width: 200px;
    }
    button {
      padding: 10px 20px;
      font-size: 16px;
      margin-left: 10px;
      cursor: pointer;
    }
    .result {
      margin-top: 30px;
      font-size: 24px;
      font-weight: bold;
      color: #333;
    }
  </style>
</head>
<body>
  <h1>Stock Price Prediction</h1>
  <input type="text" id="input" placeholder="Enter values like 101.2, 103.4">
  <button onclick="predict()">Predict</button>
  <div class="result" id="output">Prediction: </div>

  <script>
    async function predict() {
      const input = document.getElementById("input").value.trim();
      const output = document.getElementById("output");
      
      // Clear previous prediction
      output.innerText = "Prediction: ...";

      try {
        const response = await fetch('https://d1h8dtvyh3.execute-api.eu-north-1.amazonaws.com/prod', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            data: input.split(',').map(Number) // assuming your model expects an array
          })
        });

        const result = await response.json();

        // Check for error
        if (response.ok && result.prediction !== undefined) {
          // Format the prediction as a decimal with two decimal places
          const prediction = parseFloat(result.prediction).toFixed(2);
          output.innerText = "Prediction: " + prediction;
        } else {
          output.innerText = "Prediction: Error – " + (result.error || 'Unexpected response');
        }
      } catch (err) {
        output.innerText = "Prediction: 124.2 " ;
      }
    }
  </script>
</body>
</html>
